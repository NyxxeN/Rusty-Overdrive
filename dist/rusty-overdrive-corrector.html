<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Rusty Overdrive Corrector: corrector y masterizador de audio local, en el navegador. Sin subir nada a ningún servidor.">
<title>Rusty Overdrive Corrector</title>
<style>
/* Rusty Overdrive Corrector · tema cyberpunk (óxido + neón)
   Paleta: acero oscuro, óxido naranja, cian eléctrico, magenta, ámbar, verde ácido. */
:root{
  --bg:#05060a; --bg2:#0b0d14; --plate:#11141d; --plate2:#171b27; --line:#2a2231; --rust:#8a4222; --rust2:#c2571a;
  --txt:#d6dcec; --dim:#8590aa; --cy:#19f4ff; --mg:#ff2d95; --or:#ff7a1a; --am:#ffc400; --ok:#b6ff3b; --bad:#ff3d5a; --vio:#a78bfa;
  --font-head:Bahnschrift,"Agency FB","DIN Alternate","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","Share Tech Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--txt);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(1200px 500px at 85% 110%,rgba(255,45,149,.10),transparent 60%),
    radial-gradient(900px 420px at 10% 105%,rgba(25,244,255,.08),transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .27  0 0 0 0 .13  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    var(--bg)}
/* scanlines + viñeta CRT */
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.45) 100%);opacity:.45}
button,select,input{font:inherit;color:inherit}
button{background:linear-gradient(180deg,#1b1f2c,#12151e);border:1px solid #3a3346;padding:6px 13px;cursor:pointer;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);font-family:var(--font-head);letter-spacing:.06em;text-transform:uppercase;font-size:12px;transition:.12s}
button:hover{border-color:var(--cy);color:#eaffff;text-shadow:0 0 8px var(--cy)}
button:disabled{opacity:.38;cursor:not-allowed;text-shadow:none;border-color:#3a3346}
button.primary{background:linear-gradient(135deg,#7a1b52,#a3360f);border-color:var(--or);color:#fff2e6;font-weight:700;box-shadow:0 0 0 1px #000 inset}
button.primary:hover{box-shadow:0 0 14px var(--or)}
button.primary.dirty{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px var(--or))}50%{filter:drop-shadow(0 0 12px var(--mg))}}
select{background:#12151e;border:1px solid #3a3346;padding:4px 6px;border-radius:2px}
select:focus,input:focus-visible,button:focus-visible{outline:1px solid var(--cy)}

/* ===== Cabecera: cartel de neón + horizonte ===== */
header.top{position:relative;height:96px;flex:none;display:flex;align-items:center;gap:18px;padding:6px 18px;border-bottom:2px solid var(--rust);
  background:linear-gradient(180deg,#07080d,#0c0a12);overflow:hidden;z-index:5}
header.top:before{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-45deg,var(--am) 0 8px,#111 8px 16px);opacity:.55}
#skyline{position:absolute;left:0;right:0;bottom:0;height:100%;width:100%;opacity:.8;pointer-events:none}
.sign{position:relative;z-index:2;padding:6px 18px 4px;border:2px solid var(--cy);border-radius:8px;
  box-shadow:0 0 6px var(--cy),0 0 20px rgba(25,244,255,.55),inset 0 0 10px rgba(25,244,255,.35);background:rgba(3,10,16,.65)}
.sign:before,.sign:after{content:"";position:absolute;top:-16px;width:2px;height:14px;background:#4a4f5f;box-shadow:0 0 0 1px #000}
.sign:before{left:22px}.sign:after{right:22px}
.sign-top{display:flex;align-items:baseline;gap:12px;font-family:var(--font-head);font-weight:800;line-height:1}
.rust{font-size:22px;letter-spacing:.32em;color:#ffe9d6;text-shadow:0 0 3px #fff,0 0 8px var(--or),0 0 18px var(--or),0 0 34px #ff4d00,0 0 60px #a33000}
.rust b{font-weight:inherit;animation:dead 7s infinite}
.od{font-size:36px;letter-spacing:.12em;color:#ffdff0;text-shadow:0 0 3px #fff,0 0 9px var(--mg),0 0 22px var(--mg),0 0 44px #ff0077;animation:hum 3.2s ease-in-out infinite}
.sign-sub{font-family:var(--font-head);font-size:13px;letter-spacing:.62em;text-align:right;color:#dffcff;text-shadow:0 0 4px var(--cy),0 0 12px var(--cy);margin-top:2px}
.sign-sub i{font-style:normal;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes hum{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.78}49%{opacity:1}72%{opacity:.92}}
@keyframes dead{0%,17%,19%,22%,62%,64%,100%{opacity:1}18%,21%,63%{opacity:.12}}
.sign2{position:relative;z-index:2;writing-mode:vertical-rl;text-orientation:upright;height:86px;padding:5px 7px;border:2px solid var(--or);border-radius:6px;color:#fff0e0;font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;text-shadow:0 0 4px var(--or),0 0 12px var(--or),0 0 24px #ff4d00;box-shadow:0 0 6px var(--or),0 0 16px rgba(255,122,26,.55),inset 0 0 8px rgba(255,122,26,.3);background:rgba(20,8,2,.6);display:flex;gap:4px;align-items:flex-start}
.sign2 b{font-size:26px;line-height:1;font-weight:700}.sign2 span{font-size:9px;line-height:1;letter-spacing:0;font-weight:700;opacity:.95}
.tagbar{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-left:6px}
.chip{display:inline-block;font:700 11px var(--font-head);letter-spacing:.22em;padding:3px 9px;border:1px solid;border-radius:3px;text-transform:uppercase}
#signLive{color:var(--bad);border-color:var(--bad);text-shadow:0 0 6px var(--bad);box-shadow:0 0 8px rgba(255,61,90,.45);animation:blink 1.2s steps(1) infinite}
#signLive.on{color:var(--ok);border-color:var(--ok);text-shadow:0 0 6px var(--ok);box-shadow:0 0 8px rgba(182,255,59,.4);animation:none}
.chip.cy{color:var(--cy);border-color:var(--cy);text-shadow:0 0 6px var(--cy)}
#fileWrap{position:relative;z-index:2;display:flex;align-items:center;gap:12px;min-width:0}
#fileInfo{color:var(--dim);font-family:var(--font-mono);font-size:11px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{position:relative;z-index:2;flex:1;min-width:0;margin-left:10px;color:#9fb0cf;font-family:var(--font-mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
#progress{height:3px;background:#1a1420;flex:none}#progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg),var(--or));box-shadow:0 0 10px var(--mg);transition:width .15s}

/* ===== Estructura ===== */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 450px}
#viewer{padding:10px 12px;overflow:auto;min-width:0}
#panel{border-left:2px solid var(--rust);background:linear-gradient(180deg,#0d0f17,#080a10);display:flex;flex-direction:column;min-height:0}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.time{font:600 17px var(--font-mono);min-width:158px;color:var(--cy);text-shadow:0 0 8px rgba(25,244,255,.6)}
.seg{display:inline-flex;gap:0;border:1px solid #3a3346;background:#0e1018}
.seg button{border:0;clip-path:none;padding:5px 10px;background:transparent}
.seg button.on{background:linear-gradient(180deg,#0e4a57,#08303a);color:#eaffff;box-shadow:inset 0 -2px 0 var(--cy);text-shadow:0 0 8px var(--cy)}
.seg button.on.mg{background:linear-gradient(180deg,#5a1240,#360a28);box-shadow:inset 0 -2px 0 var(--mg);text-shadow:0 0 8px var(--mg)}
.seg button.on.lv{background:linear-gradient(180deg,#5a3a08,#3a2404);box-shadow:inset 0 -2px 0 var(--am);text-shadow:0 0 8px var(--am)}
.lbl{color:var(--dim);font-size:12px}label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--dim)}
.cv{position:relative;background:#04050a;border:1px solid #3a2a24;margin-bottom:8px;overflow:hidden;box-shadow:inset 0 0 22px rgba(25,244,255,.05)}
.cv:before,.cv:after{content:"";position:absolute;width:12px;height:12px;z-index:4;pointer-events:none;border:2px solid var(--cy);opacity:.75}
.cv:before{left:0;top:0;border-right:0;border-bottom:0}.cv:after{right:0;bottom:0;border-left:0;border-top:0}
.cv canvas{display:block;width:100%}
.cv .tag{position:absolute;left:10px;top:4px;font:10px var(--font-head);letter-spacing:.08em;color:#8fa0c0;pointer-events:none;text-shadow:0 0 4px #000;text-transform:uppercase}
.cv{cursor:crosshair}#cvAna{cursor:default}
.ph{position:absolute;top:0;bottom:0;width:1px;background:#fff;box-shadow:0 0 6px var(--cy),0 0 12px var(--cy);pointer-events:none;left:0;display:none;z-index:3}
.lp{position:absolute;top:0;bottom:0;background:rgba(255,196,0,.15);border-left:1px solid var(--am);border-right:1px solid var(--am);pointer-events:none;display:none}

/* ===== Panel lateral ===== */
.tabs{display:flex;border-bottom:1px solid var(--rust)}
.tabs button{flex:1;border:0;clip-path:none;background:transparent;padding:11px 4px;color:var(--dim);font-size:12px}
.tabs button.on{color:var(--or);box-shadow:inset 0 -3px 0 var(--or);text-shadow:0 0 10px var(--or)}
#tabBody{flex:1;overflow:auto;padding:10px}
.card{position:relative;background:linear-gradient(180deg,var(--plate2),var(--plate));border:1px solid #3a2a24;margin-bottom:12px;box-shadow:0 0 0 1px #000 inset,0 4px 14px rgba(0,0,0,.5)}
.card:before,.card:after{content:"";position:absolute;top:5px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9b0a6,#4a3b33 60%,#1a1310);box-shadow:0 0 0 1px #000}
.card:before{left:5px}.card:after{right:5px}
.card>h3{margin:0;padding:9px 26px 8px 28px;font:700 13px var(--font-head);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer;
  border-bottom:1px solid #3a2a24;background:linear-gradient(90deg,rgba(194,87,26,.30),transparent 70%)}
.card>h3 span:first-child{color:#ffd9bd;text-shadow:0 0 8px rgba(255,122,26,.7)}
.card>h3 .sw{margin-left:auto}
.card .body{padding:8px 12px 12px}.card.off .body{opacity:.42}
.card .help{color:var(--dim);font-size:12px;margin:0 0 8px}
.ctl{display:grid;grid-template-columns:118px 1fr 80px;gap:8px;align-items:center;margin:4px 0}
.ctl label{color:var(--dim);font-size:12px}.ctl output{text-align:right;font:12px var(--font-mono);color:#ffd9bd}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:16px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#4a2a1a,#2a2f44);box-shadow:0 0 0 1px #000}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4px;background:var(--cy);transform:rotate(45deg);box-shadow:0 0 8px var(--cy),0 0 0 1px #000}
input[type=range]::-moz-range-track{height:3px;background:#2a2f44}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--cy);border:0;border-radius:0;transform:rotate(45deg);box-shadow:0 0 8px var(--cy)}
input[type=range]:hover::-webkit-slider-thumb{background:var(--mg);box-shadow:0 0 10px var(--mg),0 0 0 1px #000}
.sw{position:relative;width:36px;height:18px;flex:none}.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:#1a1d28;border:1px solid #3a3346;transition:.15s;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:10px;height:10px;background:#6a7088;transition:.15s}
.sw input:checked+i{background:#4a1a08;border-color:var(--or)}.sw input:checked+i:after{left:21px;background:var(--or);box-shadow:0 0 8px var(--or)}
.eqrow{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;margin:6px 0;padding:6px 4px 2px;border-top:1px dashed #3a2a24;border-left:3px solid transparent}
.eqrow.sel{border-left-color:var(--am);background:rgba(255,196,0,.05)}
.eqrow .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor;margin:auto}
.eqrow .sub{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.eqrow .mini{display:flex;flex-direction:column;font-size:11px;color:var(--dim)}.eqrow .mini b{color:#ffd9bd;font-family:var(--font-mono);font-weight:500}
.eqrow .top{display:flex;gap:6px;align-items:center}
.solo{padding:2px 8px !important;font-size:11px !important}.solo.on{background:#4a3a06;border-color:var(--am);color:#fff3c4;text-shadow:0 0 8px var(--am)}
.nband{border:1px solid #3a2a24;margin:8px 0;background:rgba(0,0,0,.25)}
.nband>summary{cursor:pointer;padding:6px 10px;font:700 12px var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:#ffd9bd;list-style:none;display:flex;align-items:center;gap:8px}
.nband>summary::-webkit-details-marker{display:none}.nband .nb{padding:4px 10px 8px}
.nrow{display:flex;gap:6px;align-items:center;margin:4px 0}
table.m{width:100%;border-collapse:collapse;font-size:12px}table.m td,table.m th{padding:4px 6px;border-bottom:1px solid #2a2231;text-align:right;font-family:var(--font-mono)}
table.m th:first-child,table.m td:first-child{text-align:left;color:var(--dim);font-family:inherit}table.m th{color:var(--dim);font-weight:500;font-family:var(--font-head);letter-spacing:.08em;text-transform:uppercase}
.good{color:var(--ok)}.warn{color:var(--am)}.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chips button{padding:2px 7px;font-size:11px;border-color:#5a2035;color:#ff9db8}
.bar{padding:9px 12px;border-top:2px solid var(--rust);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#090a10}
.note{color:var(--dim);font-size:11px}.hidden{display:none!important}.stat{font:11px var(--font-mono);color:#9fb0cf;margin-top:6px}
.styledesc{font-size:12px;color:#c9d1e6;margin:6px 0}.styledesc b{color:var(--or)}
#drop{position:fixed;inset:0;background:rgba(5,6,10,.88);display:none;align-items:center;justify-content:center;font:800 28px var(--font-head);letter-spacing:.2em;color:var(--cy);text-shadow:0 0 14px var(--cy);z-index:60;border:3px dashed var(--cy)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a2a24}::-webkit-scrollbar-track{background:#0a0b10}
@media(max-width:1000px){body{overflow:auto}main{grid-template-columns:1fr}#panel{border-left:0;border-top:2px solid var(--rust)}.sign2{display:none}}

</style>
</head>
<body>
<div id="drop">SOLTÁ EL AUDIO ACÁ</div>
<header class="top">
  <svg id="skyline" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="sign" title="Rusty Overdrive Corrector">
    <div class="sign-top"><span class="rust"><b>R</b>USTY</span><span class="od">OVERDRIVE</span></div>
    <div class="sign-sub">CORRECTOR<i>_</i></div>
  </div>
  <div class="sign2" aria-hidden="true"><b>錆</b><span>オーバードライブ</span></div>
  <div class="tagbar"><span class="chip" id="signLive">SIN SEÑAL</span><span class="chip cy">AUDIO LOCAL · 0 BYTES A LA NUBE</span></div>
  <div id="status"></div>
  <div id="fileWrap">
    <div id="fileInfo">Abrí o arrastrá un WAV / MP3 / FLAC</div>
    <button id="btnOpen" class="primary">Abrir audio…</button>
    <input type="file" id="file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.aac" hidden>
  </div>
</header>
<div id="progress"><i></i></div>
<main>
  <section id="viewer">
    <div class="transport">
      <button id="bPlay" title="Espacio" disabled>▶ Play</button>
      <button id="bStop" title="Inicio" disabled>■</button>
      <div class="time" id="time">0:00.0 / 0:00.0</div>
      <div class="seg" id="segMon" title="Teclas 1 / 2 / 3 / 4">
        <button data-v="orig" class="on">Original</button><button data-v="proc">Procesado</button><button data-v="delta" class="mg" title="Diferencia entre original y procesado con el nivel igualado, amplificada automáticamente">Lo que se quita</button><button data-v="live" class="lv" title="Escuchás el original pasando por el EQ de corrección, en tiempo real, mientras movés las bolitas">EQ en vivo</button>
      </div>
      <div class="seg" id="segCh" title="Tecla M">
        <button data-v="st" class="on">Estéreo</button><button data-v="mono">Mono</button><button data-v="L">L</button><button data-v="R">R</button>
      </div>
      <span class="lbl">Vol</span><input type="range" id="vol" min="0" max="100" value="80" style="width:90px">
      <label class="chk" title="Compensa la diferencia de LUFS entre original y procesado para no dejarte engañar por el volumen"><input type="checkbox" id="chkMatch" checked>Igualar volumen</label>
      <span class="lbl" id="lblDG">Δ 0 dB</span><input type="range" id="dgain" min="-12" max="18" value="0" style="width:70px" title="Volumen de «lo que se quita». Ya se amplifica solo (pico a −14 dBFS); este control ajusta desde ahí">
      <label class="chk" title="Shift + arrastrar sobre la onda define la región"><input type="checkbox" id="chkLoop">Bucle</label>
    </div>
    <div class="cv" id="cvWave"><canvas id="wave" data-h="150"></canvas><div class="tag" id="tagWave"></div><div class="ph"></div><div class="lp"></div></div>
    <div class="cv" id="cvHF"><canvas id="hf" data-h="86"></canvas><div class="tag">Piso agudo &gt; 6,5 kHz · gris = original · cian = procesado · línea gruesa = entre golpes</div><div class="ph"></div></div>
    <div class="cv" id="cvSpec"><canvas id="spec" data-h="230"></canvas><div class="tag" id="tagSpec">Espectrograma</div><div class="ph"></div>
      <div style="position:absolute;right:10px;top:4px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim)">
        <select id="specScale"><option value="log">Frecuencia log</option><option value="lin">Frecuencia lineal</option></select>
        Contraste <input type="range" id="specC" min="0" max="100" value="55" style="width:80px"></div></div>
    <div class="cv" id="cvAna"><canvas id="ana" data-h="150"></canvas><div class="tag">Analizador en vivo</div></div>
  </section>
  <aside id="panel">
    <div class="tabs" id="tabs"><button data-t="fix" class="on">Corregir</button><button data-t="master">Master</button><button data-t="exp">Exportar</button><button data-t="help">Ayuda</button></div>
    <div id="tabBody"></div>
    <div class="bar">
      <button id="bProc" class="primary" disabled>Procesar</button>
      <label class="chk"><input type="checkbox" id="chkAuto">Auto</label>
      <select id="preset" style="max-width:215px"><option value="">Preajustes…</option>
        <optgroup label="Limpieza de agudos">
          <option value="clean-aggr">Estándar agresivo</option>
          <option value="clean-soft">Suave (menos sensibilidad)</option>
        </optgroup>
        <optgroup label="Master por estilo" id="styleOpts"></optgroup>
        <optgroup label="Restablecer"><option value="clear">Todo apagado</option></optgroup>
      </select>
    </div>
  </aside>
</main>
<script id="common-src" type="text/plain">
/* Rusty Overdrive Corrector · dsp/00-common.js
   Utilidades compartidas (hilo principal y Worker): FFT, biquads RBJ, respuesta del ecualizador. */
'use strict';
var _fftCache = {};
function fftPlan(N) {
  if (_fftCache[N]) return _fftCache[N];
  var rev = new Uint32Array(N), bits = Math.round(Math.log2(N));
  for (var i = 0; i < N; i++) { var r = 0, x = i; for (var b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
  var cos = new Float64Array(N / 2), sin = new Float64Array(N / 2);
  for (var k = 0; k < N / 2; k++) { var a = -2 * Math.PI * k / N; cos[k] = Math.cos(a); sin[k] = Math.sin(a); }
  return (_fftCache[N] = { rev: rev, cos: cos, sin: sin });
}
/* FFT compleja in-place (radix-2). inv=true: inversa normalizada. */
function fft(re, im, inv) {
  var N = re.length, p = fftPlan(N), rev = p.rev, cs = p.cos, sn = p.sin;
  for (var i = 0; i < N; i++) { var j = rev[i]; if (j > i) { var t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
  for (var size = 2; size <= N; size <<= 1) {
    var half = size >> 1, step = N / size;
